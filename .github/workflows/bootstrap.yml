name: Bootstrap portfolio files

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Populate portfolio
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "Portfolio already populated; nothing to do."
            exit 0
          fi
          cat > /tmp/site.b64 <<'EOF'
          
          
          
          
          EOF
          base64 -d /tmp/site.b64 | tar -xzf -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build digital marketing portfolio"
          git push origin main
