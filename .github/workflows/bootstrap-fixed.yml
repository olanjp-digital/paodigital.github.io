name: Bootstrap portfolio files (fixed)

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Populate portfolio
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "Portfolio already populated; nothing to do."
            exit 0
          fi
          sed -n "/cat > \/tmp\/site.b64/,/^[[:space:]]*EOF$/p" .github/workflows/bootstrap.yml | sed '1d;$d;s/^          //' > /tmp/site.b64
          base64 -d /tmp/site.b64 | tar -xzf -
          rm -f .github/workflows/pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build digital marketing portfolio"
          git push origin main
